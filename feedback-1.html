<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback — NEAR Center</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f2ee;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6660;
    --accent: #2d6a4f;
    --accent-light: #d8f3dc;
    --border: #e0dbd4;
    --radius: 16px;
  }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 3rem 2.5rem;
    max-width: 480px;
    width: 100%;
    border: 1px solid var(--border);
    animation: fadeUp 0.5s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 15px;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-bottom: 2.5rem;
  }
  .face {
    font-size: 52px;
    margin-bottom: 1rem;
    display: block;
    animation: pop 0.4s cubic-bezier(0.34,1.56,0.64,1) 0.2s both;
  }
  @keyframes pop {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 26px;
    color: var(--text);
    margin-bottom: 0.5rem;
    font-weight: 400;
  }
  .subtitle {
    font-size: 15px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 2rem;
  }
  .divider {
    height: 1px;
    background: var(--border);
    margin: 1.75rem 0;
  }
  label {
    display: block;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 0.5rem;
  }
  textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.875rem 1rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    resize: none;
    height: 110px;
    transition: border-color 0.2s;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: #aaa; }
  button {
    margin-top: 1rem;
    width: 100%;
    padding: 0.875rem;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  button:hover { opacity: 0.88; }
  .thanks {
    display: none;
    text-align: center;
    padding: 1.5rem 0 0.5rem;
    animation: fadeUp 0.4s ease both;
  }
  .thanks p { font-size: 14px; color: var(--muted); margin-top: 0.5rem; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">NEAR Center</div>
  <span class="face">😊</span>
  <h1>Glad to hear it!</h1>
  <p class="subtitle">Thank you for letting us know your meeting went well. Your feedback means a lot to us.</p>
  <div class="divider"></div>
  <div id="form-section">
    <label>Any additional comments?</label>
    <textarea id="comment" placeholder="Share anything else on your mind (optional)..."></textarea>
    <button onclick="submitComment()">Send feedback</button>
  </div>
  <div class="thanks" id="thanks">
    <span style="font-size:32px;">✓</span>
    <p>Your feedback has been received. Thank you!</p>
  </div>
</div>
<script>
function submitComment() {
  document.getElementById('form-section').style.display = 'none';
  const t = document.getElementById('thanks');
  t.style.display = 'block';
}
</script>
</body>
</html>
